<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live HTML Editor</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
    }

    .container {
        display: flex;
        width: 100%;
        height: 100vh;
    }

    /* LEFT SIDE */
    .editor {
        width: 50%;
        height: 100%;
        background: #0d1117;
        display: flex;
        flex-direction: column;
        border-right: 2px solid #333;
    }

    .title {
        height: 55px;
        display: flex;
        align-items: center;
        padding: 0 20px;
        background: #161b22;
        font-size: 18px;
        font-weight: bold;
    }

    textarea {
        flex: 1;
        width: 100%;
        resize: none;
        border: none;
        outline: none;
        padding: 20px;
        background: #0d1117;
        color: #00ff88;
        font-size: 16px;
        line-height: 1.6;
        font-family: Consolas, monospace;
    }

    /* RIGHT SIDE */
    .preview {
        width: 50%;
        height: 100%;
        background: white;
        display: flex;
        flex-direction: column;
    }

    .preview-title {
        height: 55px;
        display: flex;
        align-items: center;
        padding: 0 20px;
        background: #161b22;
        color: white;
        font-size: 18px;
        font-weight: bold;
    }

    iframe {
        width: 100%;
        height: calc(100% - 55px);
        border: none;
        background: white;
    }

    /* MOBILE */
    @media (max-width: 700px) {
        .container {
            flex-direction: column;
        }

        .editor,
        .preview {
            width: 100%;
            height: 50%;
        }

        .editor {
            border-right: none;
            border-bottom: 2px solid #333;
        }
    }
</style>
</head>

<body>

<div class="container">

    <!-- HTML CODE -->
    <div class="editor">

        <div class="title">
            📝 HTML Code
        </div>

        <textarea id="htmlCode" spellcheck="false"><!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #6c5ce7;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #6c5ce7;
            color: white;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <h1>Hello Bro 🔥</h1>

    <p>This is my live HTML preview.</p>

    <button>Click Me</button>

</body>
</html></textarea>

    </div>


    <!-- LIVE PREVIEW -->
    <div class="preview">

        <div class="preview-title">
            👁️ Live Preview
        </div>

        <iframe id="previewFrame"></iframe>

    </div>

</div>


<script>

const editor = document.getElementById("htmlCode");
const preview = document.getElementById("previewFrame");

/* INSTANT LIVE PREVIEW */
function updatePreview() {
    preview.srcdoc = editor.value;
}

/* Update EVERY time you type */
editor.addEventListener("input", updatePreview);

/* First preview */
updatePreview();

</script>

</body>
  </html>
