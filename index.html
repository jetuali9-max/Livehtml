<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live HTML Editor</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* MAIN: ALWAYS LEFT + RIGHT */
.container {
    display: flex;
    flex-direction: row;
    width: 100vw;
    height: 100vh;
}

/* LEFT CODE EDITOR */
.editor {
    width: 50%;
    height: 100%;
    background: #0d1117;
    display: flex;
    flex-direction: column;
    border-right: 2px solid #333;
}

.title {
    height: 50px;
    min-height: 50px;
    display: flex;
    align-items: center;
    padding-left: 18px;
    background: #161b22;
    color: white;
    font-weight: bold;
}

textarea {
    width: 100%;
    height: calc(100% - 50px);
    resize: none;
    border: none;
    outline: none;
    padding: 18px;
    background: #0d1117;
    color: #00ff88;
    font-size: 15px;
    font-family: Consolas, monospace;
    line-height: 1.5;
}

/* RIGHT LIVE PREVIEW */
.preview {
    width: 50%;
    height: 100%;
    background: white;
    display: flex;
    flex-direction: column;
}

.preview-title {
    height: 50px;
    min-height: 50px;
    display: flex;
    align-items: center;
    padding-left: 18px;
    background: #161b22;
    color: white;
    font-weight: bold;
}

iframe {
    width: 100%;
    height: calc(100% - 50px);
    border: none;
    background: white;
}
</style>

</head>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="editor">

        <div class="title">
            📝 HTML CODE
        </div>

        <textarea id="code" spellcheck="false"><!DOCTYPE html>

<html>

<head>

<style>

body {
    text-align: center;
    font-family: Arial;
    padding: 40px;
}

h1 {
    color: purple;
}

button {
    padding: 12px 25px;
    background: purple;
    color: white;
    border: none;
    border-radius: 10px;
}

</style>

</head>

<body>

<h1>Hello Bro 🔥</h1>

<p>Type anything on the left.</p>

<button>Click Me</button>

</body>

</html></textarea>

    </div>


    <!-- RIGHT -->
    <div class="preview">

        <div class="preview-title">
            👁️ LIVE PREVIEW
        </div>

        <iframe id="result"></iframe>

    </div>

</div>


<script>

const code = document.getElementById("code");
const result = document.getElementById("result");

/* INSTANT LIVE UPDATE */
code.addEventListener("input", function () {

    result.srcdoc = code.value;

});

/* LOAD INITIAL CODE */
result.srcdoc = code.value;

</script>

</body>
</html>
